name: Daily E-commerce Scraper & Pricing Pipeline

on:
  schedule:
    - cron: '0 3 * * *' # Scheduled run every day at 03:00 UTC
  workflow_dispatch:     # Allows manual trigger from the GitHub Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize Database
        run: |
          python -m database.db_manager

      - name: Run Scraper Engine
        run: |
          python -m src.scrapers.base_scraper

      - name: Run Analytics Engine
        run: |
          python -m src.analytics.pricing_engine

      - name: Commit and Push DB Updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add database/
          git commit -m "auto: update pricing database [skip ci]" || exit 0
          git push
